name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# L'analyse CodeQL est activée dans Settings > Code security (configuration par défaut).
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Génération du client Prisma
        run: npm run db:generate -w backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Tests e2e (API, droits, import, rapports PDF)
        run: npm run test:e2e
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Audit des dépendances
        run: npm audit --audit-level=high

  # M1 : style puis tests sur données SYNTHÉTIQUES (fonctions, pipeline complet, service d'inférence).
  # Les contrôles anti-fuite sur les données réelles (test_dataset.py) sont ignorés ici : les données ne sont pas versionnées,
  # ils se lancent en local après `make dataset`.
  ml-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/m1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/m1/requirements.txt
      - name: Installation des dépendances (versions figées)
        run: pip install -r requirements.txt
      - name: Style (ruff)
        run: python -m ruff check .
      - name: Tests M1
        run: python -m pytest tests -q
        env:
          PYTHONUTF8: '1'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
